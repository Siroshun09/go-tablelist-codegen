name: Go CI
on: [ push, pull_request ]
permissions:
  checks: write

jobs:
  define-go-versions:
    name: Define Go Versions
    runs-on: ubuntu-latest
    outputs:
      go-versions: ${{ steps.define.outputs.go-versions }}
    steps:
      - id: define
        run: echo 'go-versions=[ "1.26", "1.27" ]' >> "$GITHUB_OUTPUT"

  test:
    needs: define-go-versions
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ${{ fromJson(needs.define-go-versions.outputs.go-versions) }}
    services:
      mariadb:
        image: mariadb:13.0.2@sha256:0e4bb0f339feba125d1154fbacd36c16ec8518f52e44e1f82ecec7d6771caf39
        ports:
          - "3306:3306"
        env:
          MYSQL_DATABASE: tablelist_db
          MYSQL_ROOT_PASSWORD: tablelist_pw
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
      postgres:
        image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        ports:
          - "5432:5432"
        env:
          POSTGRES_DB: tablelist_db
          POSTGRES_PASSWORD: tablelist_pw
        options: >-
          --health-cmd "pg_isready -U postgres -d tablelist_db"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: Siroshun09/gh-actions-workflows/.github/actions/checkout@v1
      - uses: Siroshun09/gh-actions-workflows/.github/actions/go-setup@v1
        with:
          go-version: ${{ matrix.go-version }}
      - uses: Siroshun09/gh-actions-workflows/.github/actions/go-test@v1
        with:
          check-name: Test Report (Go ${{ matrix.go-version }})
          upload-results: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          ENABLE_MYSQL_TEST: true
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: tablelist_pw
          MYSQL_DATABASE: tablelist_db
          ENABLE_POSTGRESQL_TEST: true
          POSTGRESQL_HOST: 127.0.0.1
          POSTGRESQL_PORT: 5432
          POSTGRESQL_USER: postgres
          POSTGRESQL_PASSWORD: tablelist_pw
          POSTGRESQL_DATABASE: tablelist_db

  lint:
    uses: Siroshun09/gh-actions-workflows/.github/workflows/go-lint.yml@v1
    with:
      golangci-lint-version: v2.12.2
